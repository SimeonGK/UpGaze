name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ad-hoc signing ("-") needs no certificate. Fully unsigned arm64 apps lose their sandbox
      # entitlements, and with them notifications and launch at login.
      - name: Build universal app
        run: |
          xcodebuild \
            -project UpGaze.xcodeproj \
            -scheme UpGaze \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Verify app
        run: |
          lipo -archs build/UpGaze.app/Contents/MacOS/UpGaze
          codesign --verify --deep --strict build/UpGaze.app

      - name: Create DMG
        run: |
          mkdir dmg-source
          cp -R build/UpGaze.app dmg-source/
          ln -s /Applications dmg-source/Applications
          hdiutil create -volname "UpGaze" -srcfolder dmg-source -format UDZO -ov UpGaze.dmg
          shasum -a 256 UpGaze.dmg > UpGaze.dmg.sha256

      # A tag with a suffix (v1.1.0-beta) is a pre-release, which keeps it out of /releases/latest.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            UpGaze.dmg
            UpGaze.dmg.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
